{% extends "base.html" %}

{% block title %}
Loan Application - AI Credit Risk System
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card shadow">

        <div class="card-header">
            <h2 class="mb-0">AI Credit Risk Assessment</h2>
            <p class="mb-0">
                Enter applicant details for credit risk prediction.
            </p>
        </div>

        <div class="card-body">

            <form method="POST">

                <h4 class="mb-3">Applicant Details</h4>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Applicant Name</label>
                        <input
                            type="text"
                            name="applicant_name"
                            class="form-control"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Age</label>
                        <input
                            type="number"
                            name="age"
                            class="form-control"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Gender</label>
                        <select name="gender" class="form-control">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Marital Status</label>
                        <select name="marital_status" class="form-control">
                            <option value="">Select Status</option>
                            <option value="Single">Single</option>
                            <option value="Married">Married</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Dependents</label>
                        <input
                            type="number"
                            name="dependents"
                            class="form-control"
                            value="0"
                            min="0">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Employment Status</label>
                        <select name="employment_status" class="form-control">
                            <option value="">Select Status</option>
                            <option value="Employed">Employed</option>
                            <option value="Self Employed">Self Employed</option>
                            <option value="Unemployed">Unemployed</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Occupation</label>
                        <input
                            type="text"
                            name="occupation"
                            class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Education</label>
                        <select name="education" class="form-control">
                            <option value="">Select Education</option>
                            <option value="Graduate">Graduate</option>
                            <option value="Not Graduate">Not Graduate</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Employment Years</label>
                        <input
                            type="number"
                            step="0.1"
                            name="employment_years"
                            class="form-control"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Annual Income</label>
                        <input
                            type="number"
                            step="0.01"
                            name="annual_income"
                            class="form-control"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Monthly Income</label>
                        <input
                            type="number"
                            step="0.01"
                            name="monthly_income"
                            class="form-control"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Loan Amount</label>
                        <input
                            type="number"
                            step="0.01"
                            name="loan_amount"
                            class="form-control"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Loan Term (months)</label>
                        <input
                            type="number"
                            name="loan_term"
                            class="form-control"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Existing Loans</label>
                        <input
                            type="number"
                            name="existing_loans"
                            class="form-control"
                            value="0">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Monthly Debt</label>
                        <input
                            type="number"
                            step="0.01"
                            name="monthly_debt"
                            class="form-control"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Credit History</label>
                        <select name="credit_history" class="form-control">
                            <option value="1">Good</option>
                            <option value="0">Bad</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Credit Score</label>
                        <input
                            type="number"
                            name="credit_score"
                            class="form-control"
                            min="300"
                            max="900"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Property Area</label>
                        <select name="property_area" class="form-control">
                            <option value="">Select Area</option>
                            <option value="Urban">Urban</option>
                            <option value="Semiurban">Semiurban</option>
                            <option value="Rural">Rural</option>
                        </select>
                    </div>

                </div>

                <div class="text-center mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg">
                        Submit Application
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
