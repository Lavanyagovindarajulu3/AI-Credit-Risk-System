{% extends "base.html" %}

{% block content %}

<div class="container mt-4 mb-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">
                New Loan Application
            </h3>
        </div>

        <div class="card-body">

            <form method="POST"
                  action="{{ url_for('main.loan_application') }}">

                <!-- ============================= -->
                <!-- PERSONAL INFORMATION -->
                <!-- ============================= -->

                <h5 class="text-primary mb-3">
                    Personal Information
                </h5>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Applicant Name
                        </label>

                        <input type="text"
                               name="applicant_name"
                               class="form-control"
                               required>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Age
                        </label>

                        <input type="number"
                               name="age"
                               class="form-control"
                               min="18"
                               max="100"
                               required>
                    </div>


                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Gender
                        </label>

                        <select name="gender"
                                class="form-select">

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>
                    </div>


                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Marital Status
                        </label>

                        <select name="marital_status"
                                class="form-select">

                            <option value="">
                                Select Status
                            </option>

                            <option value="Single">
                                Single
                            </option>

                            <option value="Married">
                                Married
                            </option>

                            <option value="Divorced">
                                Divorced
                            </option>

                            <option value="Widowed">
                                Widowed
                            </option>

                        </select>
                    </div>


                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Dependents
                        </label>

                        <input type="number"
                               name="dependents"
                               class="form-control"
                               min="0"
                               value="0">
                    </div>

                </div>


                <!-- ============================= -->
                <!-- EMPLOYMENT INFORMATION -->
                <!-- ============================= -->

                <hr>

                <h5 class="text-primary mb-3">
                    Employment Information
                </h5>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Employment Status
                        </label>

                        <select name="employment_status"
                                class="form-select">

                            <option value="">
                                Select Status
                            </option>

                            <option value="Employed">
                                Employed
                            </option>

                            <option value="Self-Employed">
                                Self-Employed
                            </option>

                            <option value="Business">
                                Business
                            </option>

                            <option value="Unemployed">
                                Unemployed
                            </option>

                        </select>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Occupation
                        </label>

                        <input type="text"
                               name="occupation"
                               class="form-control">
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Education
                        </label>

                        <select name="education"
                                class="form-select">

                            <option value="">
                                Select Education
                            </option>

                            <option value="High School">
                                High School
                            </option>

                            <option value="Diploma">
                                Diploma
                            </option>

                            <option value="Graduate">
                                Graduate
                            </option>

                            <option value="Post Graduate">
                                Post Graduate
                            </option>

                        </select>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Employment Years
                        </label>

                        <input type="number"
                               name="employment_years"
                               class="form-control"
                               min="0"
                               step="0.01"
                               value="0">
                    </div>

                </div>


                <!-- ============================= -->
                <!-- FINANCIAL INFORMATION -->
                <!-- ============================= -->

                <hr>

                <h5 class="text-primary mb-3">
                    Financial Information
                </h5>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Annual Income
                        </label>

                        <input type="number"
                               name="annual_income"
                               class="form-control"
                               min="0"
                               step="0.01"
                               required>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Monthly Income
                        </label>

                        <input type="number"
                               name="monthly_income"
                               class="form-control"
                               min="0"
                               step="0.01"
                               required>
                    </div>


                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Existing Loans
                        </label>

                        <input type="number"
                               name="existing_loans"
                               class="form-control"
                               min="0"
                               step="0.01"
                               value="0">
                    </div>


                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Monthly Debt
                        </label>

                        <input type="number"
                               name="monthly_debt"
                               class="form-control"
                               min="0"
                               step="0.01"
                               value="0">
                    </div>


                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Savings
                        </label>

                        <input type="number"
                               name="savings"
                               class="form-control"
                               min="0"
                               step="0.01"
                               value="0">
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Assets
                        </label>

                        <input type="number"
                               name="assets"
                               class="form-control"
                               min="0"
                               step="0.01"
                               value="0">
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Previous Defaults
                        </label>

                        <input type="number"
                               name="previous_defaults"
                               class="form-control"
                               min="0"
                               value="0">
                    </div>

                </div>


                <!-- ============================= -->
                <!-- LOAN INFORMATION -->
                <!-- ============================= -->

                <hr>

                <h5 class="text-primary mb-3">
                    Loan Information
                </h5>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Loan Amount
                        </label>

                        <input type="number"
                               name="loan_amount"
                               class="form-control"
                               min="0"
                               step="0.01"
                               required>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Loan Term (Months)
                        </label>

                        <input type="number"
                               name="loan_term"
                               class="form-control"
                               min="1"
                               required>
                    </div>

                </div>


                <!-- ============================= -->
                <!-- CREDIT INFORMATION -->
                <!-- ============================= -->

                <hr>

                <h5 class="text-primary mb-3">
                    Credit & Property Information
                </h5>

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Credit History
                        </label>

                        <select name="credit_history"
                                class="form-select"
                                required>

                           <option value="">
                               Select Credit History
                           </option>

                           <option value="1">
                               Very Poor
                           </option>

                           <option value="2">
                               Poor
                           </option>

                           <option value="3">
                               Average
                           </option>

                           <option value="4">
                               Good
                           </option>

                           <option value="5">
                               Excellent
                           </option>

                       </select>
                    </div>


                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Property Area
                        </label>

                        <select name="property_area"
                                class="form-select">

                            <option value="">
                                Select Area
                            </option>

                            <option value="Urban">
                                Urban
                            </option>

                            <option value="Semiurban">
                                Semiurban
                            </option>

                            <option value="Rural">
                                Rural
                            </option>

                        </select>
                    </div>


                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Property Value
                        </label>

                        <input type="number"
                               name="property_value"
                               class="form-control"
                               min="0"
                               step="0.01"
                               value="0">
                    </div>

                </div>


                <!-- ============================= -->
                <!-- BUTTONS -->
                <!-- ============================= -->

                <hr>

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary">

                        Submit Application

                    </button>


                    <a href="{{ url_for('main.dashboard') }}"
                       class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
