{% extends "base.html" %}

{% block title %}
Login - AI Credit Risk Assessment
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <!-- PAGE TITLE -->

                <h2 class="text-center mb-4">
                    Login
                </h2>


                <!-- LOGIN FORM -->

                <form method="POST">

                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Login
                    </button>

                </form>


                <!-- REGISTER LINK -->

                <div class="text-center mt-3">

                    <p class="mb-0">

                        Don't have an account?

                        <a
                            href="{{ url_for('main.register') }}"
                            class="text-decoration-none fw-bold"
                        >
                            Register here
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
